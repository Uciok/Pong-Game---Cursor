<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Retro Pong for one player. Move the left paddle with the arrow keys and play to 11 against the computer." />
  <meta name="theme-color" content="#10210a" />
  <title>Pong</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2306140c' width='32' height='32'/%3E%3Crect fill='%23d8ff9a' x='5' y='8' width='3' height='16'/%3E%3Crect fill='%23d8ff9a' x='24' y='9' width='3' height='16'/%3E%3Crect fill='%23fff4c2' x='14' y='14' width='4' height='4'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="cabinet">
    <header class="top">
      <p class="eyebrow">One computer opponent</p>
      <h1>Pong</h1>
    </header>

    <div class="bezel">
      <div class="screen">
        <canvas id="court" width="800" height="500" tabindex="0" aria-label="Pong court. You control the left paddle with the up and down arrow keys."></canvas>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="glare" aria-hidden="true"></div>
        <div id="overlay" class="overlay">
          <div class="card">
            <p id="kicker" class="kicker">First to 11</p>
            <h2 id="headline">Ready</h2>
            <p id="copy">You are the left paddle. The computer plays the right. Arrow keys move you up and down.</p>
            <button id="action" type="button">Start</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="deck">
      <div class="readout">
        <p>You <strong id="you">00</strong></p>
        <p>Cpu <strong id="cpu">00</strong></p>
      </div>
      <p class="help"><kbd>↑</kbd><kbd>↓</kbd> move <span class="dot" aria-hidden="true">·</span> <kbd>Esc</kbd> pause</p>
      <div class="pad" aria-label="Touch controls">
        <button id="up" type="button">Up</button>
        <button id="down" type="button">Down</button>
        <button id="pause" type="button" disabled>Pause</button>
      </div>
    </footer>
  </main>
  <p id="live" class="sr-only" aria-live="polite">Ready. First to 11. Arrow keys move the left paddle.</p>
  <script src="game.js"></script>
</body>
</html>
